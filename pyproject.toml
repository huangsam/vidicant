[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidicant"
version = "0.1.0"
description = "Cross-platform media analysis library using C++ and OpenCV"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Vidicant Contributors", email = "samhuang91@gmail.com"}
]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/vidicant"
Documentation = "https://github.com/yourusername/vidicant#readme"

[tool.setuptools.package-data]
vidicant = ["*.so", "*.dylib", "*.dll"]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]
extend-ignore = ["E203", "E501"]
